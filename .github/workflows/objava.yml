# Objavi igro na GitHub Pages ob vsakem pushu na main.
# Enkratna nastavitev: Settings › Pages › Build and deployment › Source: GitHub Actions.
# Igra je že zgrajena (npm run igra) – sem gre igra/index.html z višinskimi podatki in politika zasebnosti.
name: Objava igre

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  objava:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sestavi stran
        run: |
          mkdir -p _site
          cp igra/index.html igra/dem_core.png igra/dem_ring.png igra/og.png _site/
          cp docs/zasebnost.html _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
